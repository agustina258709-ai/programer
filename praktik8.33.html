<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Lengkap</title>
</head>
<body>
    <form action="/submit" method="post">
<label for="username">Username:</label>
<input type="text" id="username" name="username" required><br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required><br><br>

<label for="password">Password:</label>
<input type="password" id="password" name="password" required><br><br>

<label for="gender">Jenis Kelamin:</label><br>
<input type="radio" id="lk" name="gender" value="Laki-laki">
<label for="lk">Laki-laki</label>
<input type="radio" id="pr" name="gender" value="Perempuan">
<label for="pr">Perempuan</label><br><br>

<label for="hobi">Hobi:</label><br>
<input type="checkbox" id="musik" name="hobi" value="Musik">
<label for="musik">Musik</label>
<input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
<label for="olahraga">Olahraga</label><br><br>

<label for="kota">Kota:</label>
<select id="kota" name="kota">
<option>Jakarta</option>
<option>Surabaya</option>
<option>Bandung</option>
<option>Semarang</option>
</select><br><br>

<label for="bio">Biografi:</label><br>
<textarea id="bio" name="bio" rows="4" cols="30"></textarea><br><br>

<input type="submit" value="Kirim">
<input type="reset" value="Reset">
</form>

</body>
</html>
