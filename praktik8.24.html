<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe Element Input radio</title>
</head>
<body>
    <form>
<p>Pilih Jenis Kelamin:</p>
<input type="radio" id="lk" name="gender" value="Laki-laki">
<label for="lk">Laki-laki</label><br>
<input type="radio" id="pr" name="gender" value="Perempuan">
<label for="pr">Perempuan</label><br>
<input type="radio" id="rahasia" name="gender" value="Rahasia">
<label for="rahasia">Rahasia</label><br>
<input type="submit" value="Kirim">
</form>

</body>
</html>
