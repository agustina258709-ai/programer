<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selektor dalam html</title>
<style>
    /* Selektor Tag */
    p {
      color: blue;
      font-size: 18px;
    }

    /* Selektor Class */
    .biru {
      width: 100px;
      height: 100px;
      background-color: blue;
    }

    /* Selektor ID */
    #merah {
      color: white;
      background-color: red;
      padding: 10px;
    }

    /* Selektor Atribut */
    input[type="text"] {
      border: 2px solid green;
      padding: 5px;
      border: 1px solid cyan;
    }
  </style>
</head>
<body>
  <!-- Selektor Tag -->
  <p>Ini adalah paragraf dalam halaman selektor.</p>

  <!-- Selektor Class -->
  <div class="biru"></div>

  <!-- Selektor ID -->
  <div id="merah">Ini adalah div dengan id merah</div>

  <!-- Selektor Atribut -->
  <input type="text" placeholder="Masukkan teks di sini">
</body>
</html>
