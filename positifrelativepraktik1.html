<!DOCTYPE html>
<html>
<head>
<style>
.box {
  position: relative;
  width: 150px;
  height: 150px;
  background-color: lightblue;
  margin-bottom: 10px;
}
.box1 {
  left: 50px;
  top: 40px;
  background-color: lightblue;
}
.box2 {
  left: 100px;
  top: 80px;
  background-color: lightgreen;
}
.box3 {
  left: 150px;
  top: 120px;
  background-color: coral;
}
</style>
</head>
<body>
<div class="box box1">Box 1</div>
<div class="box box2">Box 2</div>
<div class="box box3">Box 3</div>
</body>
</html>
