<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan CSS Border</title>
    <style>
        /* Gaya untuk Latihan 1: 4 Kotak dengan Border Berbeda */
        .box {
            margin: 10px 0;
            padding: 10px;
            width: 200px;
        }
        .solid-black { border: 3px solid black; }
        .double-blue { border: 5px double blue; }
        .groove-green { border: 5px groove green; }
        .ridge-red { border: 5px ridge red; }

        /* Gaya untuk Latihan 2: Kartu Profil Sederhana */
        .profile-card {
            border: 2px solid gray;
            border-radius: 15px;
            padding: 20px;
            width: 80px;
            margin-top: 20px;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Latihan 1: Jenis Border</h2>
    <div class="box solid-black">Border Solid Hitam</div>
    <div class="box double-blue">Border Double Biru</div>
    <div class="box groove-green">Border Groove Hijau</div>
    <div class="box ridge-red">Border Ridge Merah</div>

    <hr>

    <h2>Latihan 2: Kartu Profil</h2>
    <div class="kartu-card">
        <img src="devinaaaaaa.png">
        <strong>devinaa</strong>
        <p>pplg 1</p>
    </div>

</body>
</html>
