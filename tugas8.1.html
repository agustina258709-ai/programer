<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 8.1 - Satuan CSS</title>
    <style>
        /* Judul menggunakan satuan px */
        h1 {
            font-size: 32px;
            color: #333;
        }

        /* Paragraf menggunakan satuan pt */
        p {
            font-size: 12pt;
        }

        /* Box menggunakan satuan cm */
        .box-cm {
            width: 5cm;
            height: 3cm;
            background-color: #ffcccc;
            margin-bottom: 20px;
            border: 1px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Box menggunakan satuan % */
        .box-persen {
            width: 50%;
            height: 100px;
            background-color: #ccf2ff;
            border: 1px solid blue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>Judul Halaman (32px)</h1>
    
    <p>Ini adalah paragraf dengan ukuran font 12pt. Satuan pt biasanya digunakan untuk media cetak.</p>

    <div class="box-cm">Box ini 5cm x 3cm</div>

    <div class="box-persen">Box ini lebarnya 50% dari layar</div>

</body>
</html>
