<!DOCTYPE html>
<html>
<head>
    <title>Praktik Border 1 - Modifikasi</title>
    <style>
        /* Class dari contoh awal */
        .solid {
            border: 3px solid blue;
            padding: 10px;
            background-color: #e3f2fd; /* Biru muda */
            margin-bottom: 5px;
        }
        .dotted {
            border: 3px dotted red;
            padding: 10px;
            background-color: #ffebee; /* Merah muda */
            margin-bottom: 5px;
        }
        .double {
            border: 5px double green;
            padding: 10px;
            background-color: #e8f5e9; /* Hijau muda */
            margin-bottom: 5px;
        }

        /* TAMBAHAN TUGAS: 3 jenis border lain & background */
        .dashed {
            border: 3px dashed orange;
            padding: 10px;
            background-color: #fff3e0; /* Oranye muda */
            margin-bottom: 5px;
        }
        .groove {
            border: 5px groove purple;
            padding: 10px;
            background-color: #f3e5f5; /* Ungu muda */
            margin-bottom: 5px;
        }
        .ridge {
            border: 5px ridge brown;
            padding: 10px;
            background-color: #efebe9; /* Cokelat muda */
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h2>Contoh Border CSS (Tugas Selesai)</h2>

    <p class="solid">Ini border solid (Latar Biru)</p>
    <p class="dotted">Ini border dotted (Latar Merah)</p>
    <p class="double">Ini border double (Latar Hijau)</p>
    
    <p class="dashed">Ini border dashed (Latar Oranye)</p>
    <p class="groove">Ini border groove (Latar Ungu)</p>
    <p class="ridge">Ini border ridge (Latar Cokelat)</p>

</body>
</html>
