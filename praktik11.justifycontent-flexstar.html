<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify-content</title>
    <style>
        .countainer{
            width: 600px;
            border:5px splid blue;
            margin:30px;
            padding:5px;
            display:flex;
            justify-content: baseline;
        }
        .countainer div{
            width: 100px;
            height: 100px;
            background-color: blue;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="countainer">
<div class="satu">1</div>
<div class="dua">2</div>
<div class="tiga">3</div>
    </div>
</body>
</html>
