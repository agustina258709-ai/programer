<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selektor dalam html</title>
    <style>
    /* Selektor Tag */
p {
  color: blue;
}

/* Selektor Class */
.kotak {
  background-color: yellow;
  padding: 10px;
}

/* Selektor ID */
#unik {
  border: 2px solid red;
  padding: 10px;
  background-color: lightgrey;
}

/* Selektor Universal */
* {
  font-family: Arial, sans-serif;
}
</style>

</head>
<body>
     <h1>Contoh Selektor Eksternal</h1>

  <!-- Selektor Tag -->
  <p>Ini paragraf menggunakan selektor tag.</p>

  <!-- Selektor Class -->
  <div class="kotak">
    <p>Paragraf dengan class "kotak".</p>
  </div>

  <!-- Selektor ID -->
  <div id="unik">
    <p>Paragraf dengan ID "unik".</p>
  </div>

  <!-- Selektor Universal -->
  <p>Paragraf ini dipengaruhi oleh selektor universal.</p>
 
</body>
</html>
