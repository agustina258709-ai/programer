<!DOCTYPE html>
<html>
<head>
    <title>Latihan 2 - Simple Layout</title>
    <style>
        body { margin: 0; font-family: sans-serif; text-align: center; }
        header { width: 100%; height: 100px; background-color: lightgrey; line-height: 100px; }
        .content { width: 100%; height: 300px; background-color: white; line-height: 300px; border: 1px solid #ddd; }
        footer { width: 100%; height: 80px; background-color: darkgrey; color: white; line-height: 80px; }
    </style>
</head>
<body>
    <header>Header: Tinggi 100px</header>
    <div class="content">Content: Tinggi 300px</div>
    <footer>Footer: Tinggi 80px</footer>
</body>
</html>
